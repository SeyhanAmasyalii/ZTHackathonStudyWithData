[project]
name = "mercek-api"
version = "0.1.0"
description = "Mercek backend: sohbet API'si (FastAPI + Azure AI Foundry)"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-projects==2.9.0",
    "azure-identity==1.26.0",
    "fastapi==0.143.3",
    "httpx==0.28.1",
    "mssql-python==1.15.0",
    "openai==3.32.0",
    "pydantic-settings==2.16.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
